name: eval-tests

on:
  push:
    paths: ["backend/eval/**", ".github/workflows/eval-tests.yml"]
  pull_request:
    paths: ["backend/eval/**", ".github/workflows/eval-tests.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      # eval/metrics.py and eval/labels.py are stdlib-only, so no torch or chromadb here.
      - run: python -m pytest eval/tests -q
        working-directory: backend
